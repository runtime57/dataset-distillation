defaults:
  - model: tiny_transformer_lm_local_bpe_1024
  - datasets: tinystories_local_bpe_1024
  - dataloader: language_modeling
  - transforms: none
  - _self_

model:
  max_seq_len: 256
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.0

datasets:
  train:
    sequence_length: ${model.max_seq_len}
    skip_texts: 0
    max_texts: 1000
    max_sequences: null
    local_text_path: "data/tinystories_train_1k.txt"
    use_cache: true
  val:
    sequence_length: ${model.max_seq_len}
    skip_texts: 10000
    max_texts: 3000
    max_sequences: null
    local_text_path: "data/tinystories_train_15k.txt"
    use_cache: true

dataloader:
  batch_size: 8

distillation:
  seed: 1
  device: auto
  run_name: "distill256_local_bpe_1024_os_fullmix_1k_n256_s400_v1"
  save_dir: "saved/distillation"
  override: true
  objective: one_step
  n_steps: 400
  log_step: 40
  save_period: 400
  save_step_checkpoints: false
  real_split: "train"
  outer_batches: 1
  inner_lr: 1e-3
  learn_inner_lr: true
  min_inner_lr: null
  max_inner_lr: null
  entropy_weight: 0.0
  max_grad_norm: 1.0
  synthetic:
    num_sequences: 256
    sequence_length: ${model.max_seq_len}
    vocab_size: ${model.vocab_size}
    batch_size: 16
    temperature: 1.0
    init_std: 0.02
    init_from_real: false
    init_mode: real_mixture
    init_mixture_eps: 1e-4
    init_mixture_offset: 0
    init_mixture_max_sequences: null
    parameterization: full
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.01
