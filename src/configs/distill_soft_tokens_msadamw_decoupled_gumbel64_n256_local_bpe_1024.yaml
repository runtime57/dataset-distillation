defaults:
  - model: tiny_transformer_lm_local_bpe_1024
  - datasets: tinystories_local_bpe_1024
  - dataloader: language_modeling
  - transforms: none
  - _self_

model:
  max_seq_len: 256
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.0

datasets:
  train:
    sequence_length: ${model.max_seq_len}
    max_texts: 10000
    max_sequences: null
    local_text_path: "data/tinystories_train_15k.txt"
  val:
    sequence_length: ${model.max_seq_len}
    max_texts: 3000
    max_sequences: null
    local_text_path: "data/tinystories_train_15k.txt"

dataloader:
  batch_size: 8

distillation:
  seed: 1
  device: auto
  run_name: "distill_msadamw16_decoupled_gumbel64_n256_conf125_tconf4_lr35e4_wd11_ob4_s800"
  save_dir: "saved/distillation"
  override: true
  objective: multi_step_adamw
  n_steps: 800
  log_step: 20
  save_period: 100
  save_step_checkpoints: false
  real_split: "train"
  outer_batches: 4
  inner_lr: 0.0035
  learn_inner_lr: false
  min_inner_lr: null
  max_inner_lr: 0.01
  entropy_weight: 0.0
  target_entropy_weight: 0.001
  max_grad_norm: 1.0
  n_inner_steps: 16
  inner_beta1: 0.9
  inner_beta2: 0.999
  inner_eps: 1e-8
  inner_weight_decay: 1.1
  synthetic:
    num_sequences: 256
    sequence_length: ${model.max_seq_len}
    vocab_size: ${model.vocab_size}
    batch_size: 16
    temperature: 1.0
    init_std: 0.02
    init_from_real: true
    init_confidence: 12.5
    target_init_confidence: 4.0
    parameterization: decoupled_topk_gumbel
    topk: 64
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
