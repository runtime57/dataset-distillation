defaults:
  - model: tiny_transformer_lm_local_bpe_1024
  - datasets: tinystories_local_bpe_1024
  - dataloader: language_modeling
  - transforms: none
  - _self_

model:
  max_seq_len: 256
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.0

datasets:
  train:
    sequence_length: ${model.max_seq_len}
    max_texts: 10000
    max_sequences: null
    local_text_path: "data/tinystories_train_15k.txt"

dataloader:
  batch_size: 8

expert:
  seed: 1
  device: auto
  optimizer: adamw
  lr: 0.0035
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  weight_decay: 1.1
  n_steps: 1024
  save_period: 16
  save_dir: "saved/expert_trajectories/tiny_lm_local_bpe_1024_seq256_adamw_lr35e4_wd11_sp16"
