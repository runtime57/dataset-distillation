defaults:
  - model: tiny_transformer_lm
  - datasets: tinystories_byte
  - dataloader: language_modeling
  - transforms: none
  - _self_

model:
  max_seq_len: 64
  d_model: 64
  n_heads: 4
  n_layers: 2
  dim_feedforward: 256
  dropout: 0.0

datasets:
  train:
    sequence_length: ${model.max_seq_len}
    max_texts: 500
    max_sequences: 256
  val:
    sequence_length: ${model.max_seq_len}
    max_texts: 200
    max_sequences: 64

dataloader:
  batch_size: 8

distillation:
  seed: 1
  device: auto
  run_name: "full_soft_one_step"
  save_dir: "saved/distillation"
  override: true
  n_steps: 100
  log_step: 10
  save_period: 50
  save_step_checkpoints: false
  real_split: "train"
  outer_batches: 1
  inner_lr: 1e-3
  learn_inner_lr: true
  min_inner_lr: null
  max_inner_lr: null
  entropy_weight: 0.0
  max_grad_norm: 1.0
  synthetic:
    num_sequences: 16
    sequence_length: ${model.max_seq_len}
    vocab_size: ${model.vocab_size}
    batch_size: 8
    temperature: 1.0
    init_std: 0.02
    init_from_real: true
    init_confidence: 5.0
    parameterization: full
    topk: 16
    num_anchors: 64
    anchor_topk: 8
    num_concepts: 64
    concept_logit_scale: 32.0
    concept_input_mode: probs
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.1
