defaults:
  - model: tiny_transformer_lm_local_bpe_1024
  - datasets: tinystories_local_bpe_1024
  - dataloader: language_modeling
  - transforms: none
  - _self_

model:
  max_seq_len: 256
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.0

datasets:
  train:
    sequence_length: ${model.max_seq_len}
    max_texts: 10000
    max_sequences: null
    local_text_path: "data/tinystories_train_15k.txt"
  val:
    sequence_length: ${model.max_seq_len}
    max_texts: 3000
    max_sequences: null
    local_text_path: "data/tinystories_train_15k.txt"

dataloader:
  batch_size: 8

distillation:
  seed: 1
  device: auto
  run_name: "distill_os_topk64_hardem_from_gumbel64_n256_s240_ob4_p10_r1024"
  save_dir: "saved/pure_em"
  override: true
  objective: one_step
  n_steps: 240
  log_step: 20
  save_period: 80
  save_step_checkpoints: false
  real_split: "train"
  outer_batches: 4
  inner_lr: 0.001
  learn_inner_lr: true
  min_inner_lr: null
  max_inner_lr: null
  entropy_weight: 0.0
  max_grad_norm: 1.0
  support_search:
    enabled: true
    period: 10
    batch_size: 16
    max_replacements: 1024
    min_gain: 0.0
    outer_batches: 4
    keep_old_hard: true
    reset_logits: true
    confidence: ${distillation.synthetic.init_confidence}
    exclude_token_ids: [0]
  synthetic:
    num_sequences: 256
    sequence_length: ${model.max_seq_len}
    vocab_size: ${model.vocab_size}
    batch_size: 16
    temperature: 1.0
    init_std: 0.02
    init_from_real: false
    init_confidence: 12.5
    init_checkpoint_path: "saved/sweep_20260604_distill/distill_os_gumbel64_n256_conf125_lr001_detckpt/full_soft_tokens_best.pth"
    init_checkpoint_confidence: null
    parameterization: topk
    topk: 64
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.005
