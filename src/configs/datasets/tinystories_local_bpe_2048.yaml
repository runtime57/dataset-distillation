train:
  _target_: src.datasets.TinyStoriesLocalBPEDataset
  split: "train"
  tokenizer_path: "artifacts/tokenizers/tinystories_bpe_2048/tokenizer.json"
  pad_token: "[PAD]"
  eos_token: "[EOS]"
  unk_token: "[UNK]"
  sequence_length: ${model.max_seq_len}
  max_texts: 2000
  max_sequences: 1024
  streaming: true
  hf_cache_dir: null
  data_dir: "data/tinystories_local_bpe_2048"
  local_text_path: null
  use_cache: true
val:
  _target_: src.datasets.TinyStoriesLocalBPEDataset
  split: "validation"
  tokenizer_path: "artifacts/tokenizers/tinystories_bpe_2048/tokenizer.json"
  pad_token: "[PAD]"
  eos_token: "[EOS]"
  unk_token: "[UNK]"
  sequence_length: ${model.max_seq_len}
  max_texts: 400
  max_sequences: 128
  streaming: true
  hf_cache_dir: null
  data_dir: "data/tinystories_local_bpe_2048"
  local_text_path: null
  use_cache: true
