train:
  _target_: src.datasets.SoftTokenCheckpointDataset
  checkpoint_path: null
  temperature: 1.0
  max_sequences: null

val:
  _target_: src.datasets.TinyStoriesLocalBPEDataset
  split: "train"
  tokenizer_path: "artifacts/tokenizers/tinystories_bpe_1024/tokenizer.json"
  pad_token: "[PAD]"
  eos_token: "[EOS]"
  unk_token: "[UNK]"
  sequence_length: ${model.max_seq_len}
  skip_texts: 10000
  max_texts: 3000
  max_sequences: null
  streaming: false
  hf_cache_dir: null
  data_dir: "data/tinystories_local_bpe_1024_fixed15k"
  local_text_path: "data/tinystories/tinystories_train_first15k.txt"
  use_cache: true

test:
  _target_: src.datasets.TinyStoriesLocalBPEDataset
  split: "train"
  tokenizer_path: "artifacts/tokenizers/tinystories_bpe_1024/tokenizer.json"
  pad_token: "[PAD]"
  eos_token: "[EOS]"
  unk_token: "[UNK]"
  sequence_length: ${model.max_seq_len}
  skip_texts: 13000
  max_texts: 2000
  max_sequences: null
  streaming: false
  hf_cache_dir: null
  data_dir: "data/tinystories_local_bpe_1024_fixed15k"
