series:
  name: results_tm_series_seq128_nl2_do01_e15_distilmulti.py
  seq_len: 128
  model_tag: nl2_do01
  parameterizations:
  - topk
  - gumbel
  k_values:
  - '64'
  - '128'
  - '256'
  distill_steps:
  - '100'
  - '200'
  - '300'
  - '400'
  - '500'
  - '600'
  best_overall:
    parameterization: topk
    k: 128
    best_epoch: 10
    val_ppl: 69.559793946727
    test_ppl: 66.40821332912923
  rerun_command: 'SEQ_LEN=128 \

    MODEL_TAG=nl2_do01 \

    TRAIN_EPOCHS=15 \

    DISTILL_STEP_VALUES="100 200 300 400 500 600" \

    K_VALUES="64 128 256" \

    ./scripts/run_tm_topk_gumbel_sweep.sh'
  source_results_csvs:
  - saved/results_seq128_nl2_do01_distil100_e15/tm_topk_gumbel_results.csv
  - saved/results_seq128_nl2_do01_distil200_e15/tm_topk_gumbel_results.csv
  - saved/results_seq128_nl2_do01_distil300_e15/tm_topk_gumbel_results.csv
  - saved/results_seq128_nl2_do01_distil400_e15/tm_topk_gumbel_results.csv
  - saved/results_seq128_nl2_do01_distil500_e15/tm_topk_gumbel_results.csv
  - saved/results_seq128_nl2_do01_distil600_e15/tm_topk_gumbel_results.csv
  source_best_csvs:
  - saved/results_seq128_nl2_do01_distil100_e15/best_res.csv
  - saved/results_seq128_nl2_do01_distil200_e15/best_res.csv
  - saved/results_seq128_nl2_do01_distil300_e15/best_res.csv
  - saved/results_seq128_nl2_do01_distil400_e15/best_res.csv
  - saved/results_seq128_nl2_do01_distil500_e15/best_res.csv
  - saved/results_seq128_nl2_do01_distil600_e15/best_res.csv
  source_eval_roots:
  - saved/eval_tm_topk_gumbel_seq128_nl2_do01_distil100_e15
  - saved/eval_tm_topk_gumbel_seq128_nl2_do01_distil200_e15
  - saved/eval_tm_topk_gumbel_seq128_nl2_do01_distil300_e15
  - saved/eval_tm_topk_gumbel_seq128_nl2_do01_distil400_e15
  - saved/eval_tm_topk_gumbel_seq128_nl2_do01_distil500_e15
  - saved/eval_tm_topk_gumbel_seq128_nl2_do01_distil600_e15
model:
  _target_: src.model.TinyTransformerLM
  vocab_size: 1024
  max_seq_len: 128
  d_model: 128
  n_heads: 4
  n_layers: 2
  dim_feedforward: 512
  dropout: 0.1
  pad_token_id: 0
trainer:
  log_step: 20
  n_epochs: 15
  epoch_len: 64
  device_tensors:
  - input_ids
  - labels
  - target_probs
  - attention_mask
  resume_from: null
  device: auto
  override: true
  monitor: min val_Perplexity
  save_period: 1
  early_stop: 15
  save_dir: null
  seed: 1
  max_grad_norm: 1.0
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0003
  weight_decay: 0.01
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 16
  num_workers: 0
  pin_memory: false
distillation:
  objective: trajectory_matching
  inner_lr: 0.01
  outer_batches: 4
  entropy_weight: 0.0
  n_steps:
  - '100'
  - '200'
  - '300'
  - '400'
  - '500'
  - '600'
  log_step: 40
  save_period: 50
  synthetic:
    num_sequences: 256
    sequence_length: 128
    vocab_size: 1024
    batch_size: 16
    temperature: 1.0
    init_std: 0.02
    init_from_real: true
    init_confidence: 12.5
    parameterization: topk
    topk: 128
