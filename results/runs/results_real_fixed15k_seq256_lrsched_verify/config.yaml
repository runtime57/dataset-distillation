model:
  _target_: src.model.TinyTransformerLM
  vocab_size: 1024
  max_seq_len: 256
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.0
  pad_token_id: 0
writer:
  _target_: src.logger.NoOpWriter
  run_name: results_real_fixed15k_seq256_lrsched_verify
  loss_names:
  - loss
  log_checkpoints: false
  id_length: 8
  run_id: 8awboc4g
metrics:
  train:
  - _target_: src.metrics.PerplexityMetric
    name: Perplexity
  inference:
  - _target_: src.metrics.PerplexityMetric
    name: Perplexity
datasets:
  train:
    _target_: src.datasets.TinyStoriesLocalBPEDataset
    split: train
    tokenizer_path: artifacts/tokenizers/tinystories_bpe_1024/tokenizer.json
    pad_token: '[PAD]'
    eos_token: '[EOS]'
    unk_token: '[UNK]'
    sequence_length: ${model.max_seq_len}
    skip_texts: 0
    max_texts: 10000
    max_sequences: null
    streaming: false
    hf_cache_dir: null
    data_dir: data/tinystories_local_bpe_1024_fixed15k
    local_text_path: data/tinystories/tinystories_train_first15k.txt
    use_cache: true
  val:
    _target_: src.datasets.TinyStoriesLocalBPEDataset
    split: train
    tokenizer_path: artifacts/tokenizers/tinystories_bpe_1024/tokenizer.json
    pad_token: '[PAD]'
    eos_token: '[EOS]'
    unk_token: '[UNK]'
    sequence_length: ${model.max_seq_len}
    skip_texts: 10000
    max_texts: 3000
    max_sequences: null
    streaming: false
    hf_cache_dir: null
    data_dir: data/tinystories_local_bpe_1024_fixed15k
    local_text_path: data/tinystories/tinystories_train_first15k.txt
    use_cache: true
  test:
    _target_: src.datasets.TinyStoriesLocalBPEDataset
    split: train
    tokenizer_path: artifacts/tokenizers/tinystories_bpe_1024/tokenizer.json
    pad_token: '[PAD]'
    eos_token: '[EOS]'
    unk_token: '[UNK]'
    sequence_length: ${model.max_seq_len}
    skip_texts: 13000
    max_texts: 2000
    max_sequences: null
    streaming: false
    hf_cache_dir: null
    data_dir: data/tinystories_local_bpe_1024_fixed15k
    local_text_path: data/tinystories/tinystories_train_first15k.txt
    use_cache: true
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 16
  num_workers: 0
  pin_memory: false
transforms:
  batch_transforms:
    train: null
    inference: null
  instance_transforms:
    train: null
    inference: null
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0003
  weight_decay: 0.01
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.95
  step_size: ${trainer.epoch_len}
loss_function:
  _target_: src.loss.LanguageModelingLoss
trainer:
  log_step: 50
  n_epochs: 3
  epoch_len: 1311
  device_tensors:
  - input_ids
  - labels
  - attention_mask
  resume_from: null
  device: auto
  override: true
  save_only_best: true
  monitor: min val_Perplexity
  save_period: 1000
  early_stop: ${trainer.n_epochs}
  save_dir: results/runs
  seed: 1
  max_grad_norm: 1.0
