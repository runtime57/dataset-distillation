  - saved/eval_tm_topk_gumbel_seq256_nl4_do00_fixed15k_expertadam_distil400_e15_k4_8_16_32_64_128_256
model:
  _target_: src.model.TinyTransformerLM
  vocab_size: 1024
  max_seq_len: 256
  d_model: 128
  n_heads: 4
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.0
  pad_token_id: 0
trainer:
  log_step: 50
  n_epochs: 15
  epoch_len: 64
  device_tensors:
  - input_ids
  - labels
  - target_probs
  - attention_mask
  resume_from: null
  device: auto
  override: true
  monitor: min val_Perplexity
  save_period: 1
  early_stop: 15
  save_dir: saved/eval_tm_topk_gumbel_seq256_nl4_do00_fixed15k_expertadam_distil400_e15_k4_8_16_32_64_128_256
  seed: 1
  max_grad_norm: 1.0
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0003
  weight_decay: 0.01
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 8
  num_workers: 0
  pin_memory: false
distillation:
  objective: trajectory_matching
  inner_lr: 0.01
  outer_batches: 4
  entropy_weight: 0.0
  n_steps: 400
  log_step: 40
  save_period: 50
  synthetic:
    num_sequences: 256
    sequence_length: 256
    vocab_size: 1024
    batch_size: 16
    temperature: 1.0
    init_std: 0.02
    init_from_real: true
    init_confidence: 12.5
    parameterization: topk
    topk: 16
